[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "GinoTaipe", email = "" }
]
requires-python = ">=3.13"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.163.2",
    "httpx>=0.28.1",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
backend = "backend.main:run"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
