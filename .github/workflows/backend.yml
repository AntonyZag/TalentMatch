name: Backend CI y despliegue

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

permissions:
  contents: read

concurrency:
  group: render-backend-main
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.6'

      - name: Ejecutar pytest
        working-directory: backend
        run: uv run --locked python -m pytest

      - name: Validar la imagen Docker
        run: docker build ./backend

      - name: Solicitar el despliegue del backend en Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.HOOK_RENDER_BACKEND }}
        run: |
          : "${RENDER_DEPLOY_HOOK:?Falta configurar HOOK_RENDER_BACKEND}"
          curl -fsS -X POST --max-time 30 --output /dev/null "${RENDER_DEPLOY_HOOK}&ref=${GITHUB_SHA}"
